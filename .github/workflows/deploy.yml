name: deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: docs-site-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_SITE_NAME: larkax
      DOCS_SITE_TAGLINE: 默认入口 larkax.com，也可以自部署
      DOCS_SITE_DESCRIPTION: 客户端把 Claude Code、Codex、OpenAI、Anthropic 与 Gemini SDK 指向同一个地址；八种线协议可进可出，其中四种对话协议之间可以互相转换。默认使用 larkax.com，也可以在自己的主机上部署同一套网关。
      DOCS_SITE_LOCALE: zh-CN
      NEXT_PUBLIC_SITE_URL: https://docs.larkax.com
      DOCS_SITE_URL: https://docs.larkax.com
      DOCS_CONTENT_REPO: sumwai/lax-docs
      DOCS_CONTENT_REF: main
      DOCS_CONTENT_SUBDIR: content/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Build standalone site
        # site.config.ts 在构建时读取这些变量；缺了就会把默认品牌 Docs 写进静态页面。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "$DOCS_SITE_NAME"
          test -n "$NEXT_PUBLIC_SITE_URL"
          # 上一版删除或改名的页面会留在 .next-build 里；发布产物必须是这次内容的全量结果。
          if [ -d .next-build ]; then find .next-build -mindepth 1 -delete; fi
          node scripts/fetch-content.mjs
          npm run build
          grep -q '<title>larkax' .next-build/server/app/docs.html
          if grep -R -q --include='*.html' '/docs/hosted' .next-build/server/app; then
            echo '构建产物仍包含已下线的 /docs/hosted 链接' >&2
            exit 1
          fi
          grep -q 'href="/docs/clients' .next-build/server/app/docs.html

      - name: Pack standalone output
        run: |
          set -euo pipefail
          root=.next-build/standalone
          test -f "$root/server.js"
          cp -r .next-build/static "$root/.next-build/static"
          mkdir -p "$root/public"
          if [ -d public ]; then cp -r public/. "$root/public/"; fi
          tar -czf docs-site.tar.gz -C "$root" .

      - name: Install deploy key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          HEALTH_PREFIX: larkax
        run: scripts/deploy.sh docs-site.tar.gz
